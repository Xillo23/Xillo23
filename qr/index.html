<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GI9001 OS • Testo QR</title>
<style>
  :root {
    --bg-deep: #0a0305;
    --bg-glow: #300b11;
    --card-top: #260f15;
    --card-bot: #120609;
    --card-brd: #682630;
    --box-bg: #16090c;
    --box-brd: #4a1c24;
    --accent: #ff6464;
    --accent-dark: #c82e3b;
    --text: #ffffff;
    --muted: #e2b8bc;
    --sub: #9e8c8e;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 28%, var(--bg-glow) 0%, var(--bg-deep) 74%);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 16px 32px;
  }
  .shell {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 4px 2px;
  }
  .hdr-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .badge-icon {
    width: 46px;
    height: 46px;
    border-radius: 15px;
    background: linear-gradient(180deg, #df7a82 0%, #9e353e 100%);
    border: 2px solid #f5b5ba;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 16px;
    color: #fff5f6;
    box-shadow: 0 6px 18px rgba(225, 75, 86, 0.28);
  }
  .hdr-kicker {
    font-size: 11px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: #c08489;
    font-weight: 700;
  }
  .hdr-title {
    font-size: 26px;
    font-weight: 800;
    line-height: 1.1;
    color: #ffffff;
  }
  .pill-status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 13px;
    border-radius: 999px;
    background: linear-gradient(180deg, #38131a 0%, #220a0e 100%);
    border: 1px solid #6e2530;
    font-size: 12px;
    font-weight: 700;
    color: #ffd8dc;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 8px var(--ok);
  }
  .card {
    background: linear-gradient(180deg, var(--card-top) 0%, var(--card-bot) 100%);
    border: 2px solid var(--card-brd);
    border-radius: 28px;
    padding: 20px 18px;
    box-shadow: 0 18px 42px rgba(0, 0, 0, 0.55);
  }
  .card-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .card-label span {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .char-counter {
    font-size: 12px;
    color: #ffb4b4;
    background: #2b1116;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid #5c242e;
    font-weight: 600;
  }
  textarea {
    width: 100%;
    min-height: 235px;
    background: var(--box-bg);
    color: #fff5f6;
    border: 1.5px solid var(--box-brd);
    border-radius: 18px;
    padding: 15px;
    font-size: 16px;
    line-height: 1.45;
    resize: vertical;
    outline: none;
    font-family: inherit;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255, 100, 100, 0.18);
  }
  textarea::placeholder {
    color: #876368;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .btn-sec {
    flex: 1;
    min-width: 110px;
    background: linear-gradient(180deg, #33161c 0%, #210d11 100%);
    color: #ffd8dc;
    border: 1px solid #5c2832;
    border-radius: 14px;
    padding: 11px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .btn-sec:active {
    background: #4a2229;
  }
  .opt-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    padding: 11px 14px;
    border-radius: 16px;
    background: rgba(26, 11, 14, 0.75);
    border: 1px solid #3d2026;
    font-size: 14px;
    color: var(--muted);
  }
  .opt-row input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
  }
  .btn-send {
    width: 100%;
    margin-top: 16px;
    background: linear-gradient(180deg, #ff6464 0%, #d93843 100%);
    color: #1a0507;
    border: 1px solid #ff9494;
    border-radius: 18px;
    padding: 17px 18px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.4px;
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(255, 100, 100, 0.32);
    transition: transform 0.1s;
  }
  .btn-send:active {
    transform: scale(0.985);
    background: linear-gradient(180deg, #ff8585 0%, #e64848 100%);
  }
  .btn-send:disabled {
    opacity: 0.55;
    cursor: wait;
  }
  .status-card {
    background: linear-gradient(180deg, #1a1214 0%, #120b0d 100%);
    border: 1px solid #3d2428;
    border-radius: 22px;
    padding: 15px 18px;
    font-size: 13px;
    color: var(--sub);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .status-msg {
    color: #fff5f6;
    font-weight: 600;
    font-size: 14px;
  }
  .toast-ok {
    color: var(--ok);
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="hdr">
      <div class="hdr-left">
        <div class="badge-icon">QR</div>
        <div>
          <div class="hdr-kicker">GI9001 OS v6.7</div>
          <div class="hdr-title">Testo QR</div>
        </div>
      </div>
      <div class="pill-status">
        <span class="dot"></span>
        <span>OVUNQUE (4G/WIFI)</span>
      </div>
    </div>

    <div class="card">
      <div class="card-label">
        <span>Casella Testo (Non in tempo reale)</span>
        <span class="char-counter" id="charCount">0 caratteri</span>
      </div>

      <textarea id="txtBox" placeholder="Scrivi qui qualsiasi cosa o incolla un lungo testo...&#10;&#10;Il testo NON viene inviato mentre scrivi: quando hai finito, tocca il pulsante qui sotto per inviarlo al Samsung GT-I9001 che lo scriverà tutto rapidamente sul PC."></textarea>

      <div class="toolbar">
        <button type="button" class="btn-sec" id="btnPaste">Incolla dagli Appunti</button>
        <button type="button" class="btn-sec" id="btnClear">Svuota</button>
      </div>

      <label class="opt-row">
        <span>Premi automaticamente <b>INVIO</b> alla fine</span>
        <input type="checkbox" id="chkEnter">
      </label>

      <button type="button" class="btn-send" id="btnSend">
        INVIA AL TELEFONO E DIGITA SUL PC
      </button>
    </div>

    <div class="status-card">
      <div style="font-size:11px; letter-spacing:1px; text-transform:uppercase; color:#e57373; font-weight:700;">
        Stato Trasmissione Cloud &rarr; GT-I9001 &rarr; PC
      </div>
      <div class="status-msg" id="statusMsg">Pronto su qualsiasi rete (4G/5G/Wi-Fi). Scrivi o incolla il testo e premi Invia.</div>
      <div>Modalità: <b>Cloud Relay Istantaneo &rarr; USB HID (046d:c31c)</b></div>
    </div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const CHANNEL = params.get('c') || 'gi9001_xillo23_qr_kbd_v67';
  const RELAY_URL = 'https://ntfy.sh/' + encodeURIComponent(CHANNEL);

  const txtBox = document.getElementById('txtBox');
  const charCount = document.getElementById('charCount');
  const btnPaste = document.getElementById('btnPaste');
  const btnClear = document.getElementById('btnClear');
  const btnSend = document.getElementById('btnSend');
  const chkEnter = document.getElementById('chkEnter');
  const statusMsg = document.getElementById('statusMsg');

  function updateCount() {
    const n = txtBox.value.length;
    charCount.textContent = n + (n === 1 ? ' carattere' : ' caratteri');
  }
  txtBox.addEventListener('input', updateCount);

  btnPaste.addEventListener('click', async () => {
    try {
      const clip = await navigator.clipboard.readText();
      if (clip) {
        const start = txtBox.selectionStart || txtBox.value.length;
        const end = txtBox.selectionEnd || txtBox.value.length;
        txtBox.value = txtBox.value.slice(0, start) + clip + txtBox.value.slice(end);
        updateCount();
        txtBox.focus();
      }
    } catch (e) {
      txtBox.focus();
      statusMsg.textContent = 'Tieni premuto dentro la casella e scegli "Incolla".';
    }
  });

  btnClear.addEventListener('click', () => {
    txtBox.value = '';
    updateCount();
    txtBox.focus();
  });

  function utf8ToBase64(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) {
      bin += String.fromCharCode(bytes[i]);
    }
    return btoa(bin);
  }

  btnSend.addEventListener('click', async () => {
    let text = txtBox.value;
    if (!text) {
      statusMsg.textContent = 'La casella è vuota: scrivi o incolla prima un testo.';
      txtBox.focus();
      return;
    }
    if (chkEnter.checked && !text.endsWith('\n')) {
      text += '\n';
    }
    btnSend.disabled = true;
    btnSend.textContent = 'INVIO AL GT-I9001 IN CORSO...';
    statusMsg.className = 'status-msg';
    statusMsg.textContent = 'Invio del testo al telefono GT-I9001...';

    try {
      /* Se la pagina è aperta direttamente dal server locale usa /api/send,
         altrimenti invia sul canale Cloud HTTPS globale (funziona su 4G/5G/Wi-Fi ovunque!) */
      let sentOk = false;
      if (window.location.hostname === '192.168.0.101' || window.location.hostname === '127.0.0.1') {
        const rLocal = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json; charset=utf-8' },
          body: JSON.stringify({ text: text })
        });
        const dLocal = await rLocal.json();
        sentOk = !!dLocal.ok;
      } else {
        /* Spezza eventuali testi enormi in blocchi da 2800 caratteri per consegna istantanea */
        const chunkSize = 2800;
        const batchId = Date.now().toString(36);
        const totalChunks = Math.ceil(text.length / chunkSize);
        for (let idx = 0; idx < totalChunks; idx++) {
          const part = text.slice(idx * chunkSize, (idx + 1) * chunkSize);
          const payload = JSON.stringify({
            gi_qr: 1,
            id: batchId,
            idx: idx,
            tot: totalChunks,
            b64: utf8ToBase64(part)
          });
          const res = await fetch(RELAY_URL, {
            method: 'POST',
            body: payload
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
        }
        sentOk = true;
      }

      if (sentOk) {
        statusMsg.className = 'status-msg toast-ok';
        statusMsg.textContent = 'Inviato! Il telefono GT-I9001 sta digitando ' + text.length + ' caratteri sul PC...';
      } else {
        statusMsg.textContent = 'Errore durante la trasmissione.';
      }
    } catch (err) {
      statusMsg.textContent = 'Errore di connessione: ' + err.message;
    } finally {
      btnSend.disabled = false;
      btnSend.textContent = 'INVIA AL TELEFONO E DIGITA SUL PC';
    }
  });
</script>
</body>
</html>
