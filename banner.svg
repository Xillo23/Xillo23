<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-label="Xillo23 — Indie developer">
  <defs>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="998" height="208" rx="16"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#1d141b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5e5b"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5e5b" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1000" height="210" fill="url(#bg)"/>
    <rect x="0" y="0" width="1000" height="5" fill="url(#accent)"/>

    <!-- Subtle right-side geometric accents -->
    <circle cx="885" cy="105" r="125" fill="url(#glow)"/>
    <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.2" fill="none">
      <circle cx="885" cy="105" r="54"/>
      <circle cx="885" cy="105" r="88"/>
      <line x1="755" y1="105" x2="980" y2="105"/>
      <line x1="885" y1="16" x2="885" y2="194"/>
    </g>

    <line x1="712" y1="46" x2="712" y2="168" stroke="#30363d" stroke-width="1"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">
      <text x="742" y="70"><tspan fill="#ff7b72">01</tspan>  native quality</text>
      <text x="742" y="96"><tspan fill="#f97316">02</tspan>  zero bloat</text>
      <text x="742" y="122"><tspan fill="#f59e0b">03</tspan>  open source</text>
      <text x="742" y="148"><tspan fill="#ff7b72">04</tspan>  built for fun</text>
    </g>

    <!-- X monogram -->
    <rect x="44" y="55" width="96" height="96" rx="22" fill="#161b22" stroke="url(#accent)" stroke-width="2.5"/>
    <path d="M72 81 L112 125 M112 81 L72 125" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>

    <!-- Main text -->
    <text x="168" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#f0f6fc" letter-spacing="-0.5">Xillo23</text>
    <text x="168" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#c9d1d9">Indie developer · Small, useful apps &amp; mods</text>

    <!-- Pills -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
      <rect x="168" y="144" width="138" height="26" rx="13" fill="#ff5e5b" fill-opacity="0.16" stroke="#ff5e5b" stroke-opacity="0.48"/>
      <text x="237" y="161" text-anchor="middle" fill="#ff9b99">Free &amp; Open Source</text>

      <rect x="316" y="144" width="76" height="26" rx="13" fill="#30363d" fill-opacity="0.55" stroke="#484f58"/>
      <text x="354" y="161" text-anchor="middle" fill="#c9d1d9">No Ads</text>

      <rect x="402" y="144" width="102" height="26" rx="13" fill="#30363d" fill-opacity="0.55" stroke="#484f58"/>
      <text x="453" y="161" text-anchor="middle" fill="#c9d1d9">No Tracking</text>
    </g>
  </g>

  <rect x="1" y="1" width="998" height="208" rx="16" fill="none" stroke="#30363d" stroke-width="1.5"/>
</svg>